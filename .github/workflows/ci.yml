name: Sprint 2 and 3 checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:sprint3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprint3-verification
          path: test-results/
